[install]
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# Each entry bypasses the 24h guard for one package — confirm with the user
# before adding any.
minimumReleaseAgeExcludes = []

[test]
# Registers a DOM (happy-dom) and extends expect() with jest-dom matchers before every test file
# — bun test has no DOM of its own. See test/setup.ts for what this actually does.
preload = ["./test/setup.ts"]
# bun test's default file discovery is project-wide and matches both *.test.* and *.spec.* names,
# so without this it also tries to run supabase/functions/_tests/*.test.ts (Deno tests — jsr:/
# npm: specifiers, Deno.test, Deno.env) and e2e/*.spec.ts (Playwright tests — test.beforeEach()
# from @playwright/test, a different `test` global entirely). Neither means anything to bun test's
# runtime; see CLAUDE.md "Testing".
pathIgnorePatterns = ["supabase/functions/**", "e2e/**"]
